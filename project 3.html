<!DOCTYPE html>
<html>
<head>
    <title>My Creative Website</title>

    <style>
        body {
            background-color: #101020;
            color: white;
            text-align: center;
            font-family: Arial;
            margin: 0;
        }

        .header {
            background-color: #191933;
            padding: 20px;
        }

        .header h1 {
            color: cyan;
        }

        .header p {
            color: lightgray;
        }

        .box {
            background-color: #202040;
            width: 350px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 15px cyan;
        }

        .box h2 {
            color: yellow;
        }

        .box p {
            color: lightgray;
            font-size: 17px;
        }

        .skills {
            margin: 20px;
        }

        .skills span {
            background-color: #303060;
            padding: 8px 12px;
            margin: 5px;
            display: inline-block;
            border-radius: 20px;
        }

        button {
            background-color: cyan;
            color: black;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: yellow;
        }

        footer {
            background-color: #191933;
            padding: 15px;
            color: gray;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>GIVOX</h1>
        <p>Welcome to my creative world</p>
    </div>

    <div class="box">

        <h2>🎮 My Profile</h2>

        <p>Hello! My name is Guruprasath.</p>

        <p>
            I am learning programming and
            web development.
        </p>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>JavaScript</span>
            <span>Gaming</span>
        </div>

        <br>

        <button>Explore More</button>

    </div>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
