
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Tester</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            text-align: center;
            padding: 40px 15px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0001;
        }

        #text {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 10px;
            font-size: 19px;
            line-height: 1.7;
            text-align: left;
        }

        textarea {
            width: 100%;
            height: 120px;
            margin-top: 20px;
            padding: 12px;
            box-sizing: border-box;
            font-size: 17px;
            border: 2px solid #c7d2fe;
            border-radius: 8px;
            resize: vertical;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            margin: 25px 0;
        }

        .stats div {
            background: #eef2ff;
            padding: 15px;
            border-radius: 10px;
            min-width: 100px;
        }

        .stats h2 {
            color: #4f46e5;
            margin: 5px;
        }

        button {
            background: #4f46e5;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #3730a3;
        }

        #message {
            color: #4f46e5;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>⌨️ Typing Speed Test</h1>
    <p>Type the sentence below as quickly and accurately as you can.</p>

    <div id="text"></div>

    <textarea id="input"
        placeholder="Click here and start typing..."
        disabled></textarea>

    <div class="stats">
        <div>
            <p>Time</p>
            <h2 id="time">60</h2>
            <small>seconds</small>
        </div>

        <div>
            <p>Speed</p>
            <h2 id="wpm">0</h2>
            <small>WPM</small>
        </div>

        <div>
            <p>Accuracy</p>
            <h2 id="accuracy">100%</h2>
        </div>
    </div>

    <button id="start">Start Test</button>
    <p id="message">Press Start Test when you're ready.</p>
</div>

<script>
    const sentence =
        "JavaScript makes websites interactive and helps developers create amazing applications.";

    const text = document.getElementById("text");
    const input = document.getElementById("input");
    const start = document.getElementById("start");

    let timeLeft = 60;
    let timer = null;
    let running = false;

    text.textContent = sentence;

    start.addEventListener("click", () => {
        clearInterval(timer);

        timeLeft = 60;
        running = true;

        input.value = "";
        input.disabled = false;
        input.focus();

        document.getElementById("time").textContent = timeLeft;
        document.getElementById("wpm").textContent = 0;
        document.getElementById("accuracy").textContent = "100%";
        document.getElementById("message").textContent =
            "Start typing!";

        start.textContent = "Restart Test";

        timer = setInterval(() => {
            timeLeft--;

            document.getElementById("time").textContent = timeLeft;
            updateStats();

            if (timeLeft <= 0) {
                finishTest();
            }
        }, 1000);
    });

    input.addEventListener("input", () => {
        if (!running) return;

        updateStats();

        if (input.value === sentence) {
            finishTest();
            document.getElementById("message").textContent =
                "🎉 Perfect! You typed the complete sentence!";
        }
    });

    function updateStats() {
        const typed = input.value;
        let correct = 0;

        for (let i = 0; i < typed.length; i++) {
            if (typed[i] === sentence[i]) {
                correct++;
            }
        }

        const accuracy = typed.length === 0
            ? 100
            : Math.round((correct / typed.length) * 100);

        const elapsed = 60 - timeLeft;
        const minutes = elapsed / 60;

        const wpm = minutes > 0
            ? Math.round((typed.length / 5) / minutes)
            : 0;

        document.getElementById("wpm").textContent = wpm;
        document.getElementById("accuracy").textContent =
            accuracy + "%";
    }

    function finishTest() {
        clearInterval(timer);
        running = false;
        input.disabled = true;

        document.getElementById("message").textContent =
            "Test finished! Click Restart Test to try again.";
    }
</script>

</body>
</html>
