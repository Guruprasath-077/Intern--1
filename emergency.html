
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emergency Control Center</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #101827;
        color: white;
    }

    header {
        background: #1e293b;
        padding: 22px;
        text-align: center;
        border-bottom: 3px solid #38bdf8;
    }

    .container {
        max-width: 700px;
        margin: 30px auto;
        padding: 15px;
    }

    .panel {
        background: #1e293b;
        padding: 22px;
        margin-bottom: 20px;
        border-radius: 12px;
    }

    .status {
        color: #4ade80;
        font-weight: bold;
    }

    button {
        padding: 12px 16px;
        margin: 6px 3px;
        border: none;
        border-radius: 7px;
        background: #0284c7;
        color: white;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.8;
    }

    .danger {
        background: #dc2626;
    }

    .reset {
        background: #475569;
    }

    #log {
        line-height: 1.8;
        overflow-wrap: anywhere;
    }

    .alert {
        color: #f87171;
        font-weight: bold;
    }
</style>
</head>

<body>

<header>
    <h1>🚨 Emergency Control Center</h1>
    <p>Interactive emergency response simulator</p>
</header>

<div class="container">

    <div class="panel">
        <h2>System Status</h2>
        <p>Status: <span id="status" class="status">SYSTEM NORMAL</span></p>
        <p>Alerts triggered: <span id="count">0</span></p>
    </div>

    <div class="panel">
        <h2>Simulate an Event</h2>
        <p>Choose an event to test the dashboard.</p>

        <button class="danger" onclick="triggerAlert('Fire')">
            🔥 Fire Alert
        </button>

        <button class="danger" onclick="triggerAlert('Medical')">
            🏥 Medical Alert
        </button>

        <button class="danger" onclick="triggerAlert('Security')">
            🔒 Security Alert
        </button>

        <button class="reset" onclick="resetSystem()">
            Reset System
        </button>
    </div>

    <div class="panel">
        <h2>Event Log</h2>
        <div id="log">No events recorded.</div>
    </div>

</div>

<script>
    let alertCount = 0;

    function triggerAlert(type) {
        alertCount++;

        const time = new Date().toLocaleTimeString();

        document.getElementById("status").textContent =
            "⚠ " + type.toUpperCase() + " ALERT";

        document.getElementById("status").style.color = "#f87171";

        document.getElementById("count").textContent = alertCount;

        const log = document.getElementById("log");

        if (log.textContent === "No events recorded.") {
            log.replaceChildren();
        }

        const entry = document.createElement("p");
        entry.className = "alert";
        entry.textContent =
            "[" + time + "] " + type + " alert simulated.";

        log.prepend(entry);
    }

    function resetSystem() {
        alertCount = 0;

        document.getElementById("status").textContent =
            "SYSTEM NORMAL";

        document.getElementById("status").style.color = "#4ade80";

        document.getElementById("count").textContent = "0";
        document.getElementById("log").textContent =
            "No events recorded.";
    }
</script>

</body>
</html>
