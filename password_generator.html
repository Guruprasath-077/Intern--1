
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.container {
    width: 350px;
    background: #1e293b;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #0005;
}
h1 {
    text-align: center;
    color: #38bdf8;
}
.output {
    display: flex;
    gap: 5px;
}
#password {
    width: 100%;
    min-width: 0;
    padding: 12px;
    background: #0f172a;
    color: white;
    border: 1px solid #475569;
    border-radius: 7px;
}
button {
    padding: 10px;
    background: #0284c7;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}
button:hover {
    background: #0369a1;
}
.options {
    margin: 20px 0;
}
.option {
    margin: 12px 0;
}
input[type="number"] {
    width: 55px;
    padding: 6px;
    border-radius: 5px;
}
.generate {
    width: 100%;
    padding: 13px;
    font-size: 16px;
}
#strength {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
    <h1>Password Generator</h1>

    <div class="output">
        <input id="password" readonly placeholder="Your password">
        <button onclick="copyPassword()">Copy</button>
    </div>

    <div class="options">
        <div class="option">
            Password Length:
            <input type="number" id="length" value="12" min="4" max="50">
        </div>

        <div class="option">
            <input type="checkbox" id="upper" checked>
            Uppercase Letters
        </div>

        <div class="option">
            <input type="checkbox" id="lower" checked>
            Lowercase Letters
        </div>

        <div class="option">
            <input type="checkbox" id="numbers" checked>
            Numbers
        </div>

        <div class="option">
            <input type="checkbox" id="symbols" checked>
            Symbols
        </div>
    </div>

    <button class="generate" onclick="generatePassword()">
        Generate Password
    </button>

    <div id="strength">Password strength: --</div>
</div>

<script>
function generatePassword() {
    const length = Number(document.getElementById("length").value);

    if (!Number.isInteger(length) || length < 4 || length > 50) {
        alert("Choose a length between 4 and 50.");
        return;
    }

    let characters = "";
    let groups = [];

    if (document.getElementById("upper").checked) {
        groups.push("ABCDEFGHIJKLMNOPQRSTUVWXYZ");
    }
    if (document.getElementById("lower").checked) {
        groups.push("abcdefghijklmnopqrstuvwxyz");
    }
    if (document.getElementById("numbers").checked) {
        groups.push("0123456789");
    }
    if (document.getElementById("symbols").checked) {
        groups.push("!@#$%^&*()_+-=");
    }

    if (groups.length === 0) {
        alert("Select at least one character type!");
        return;
    }

    characters = groups.join("");
    let password = "";

    groups.forEach(group => {
        password += group[Math.floor(Math.random() * group.length)];
    });

    while (password.length < length) {
        password += characters[
            Math.floor(Math.random() * characters.length)
        ];
    }

    password = password.split("").sort(() => Math.random() - 0.5).join("");

    document.getElementById("password").value = password;

    let strength = "Weak";
    if (length >= 12 && groups.length >= 3) strength = "Strong";
    if (length >= 16 && groups.length === 4) strength = "Very Strong";

    document.getElementById("strength").textContent =
        "Password strength: " + strength;
}

async function copyPassword() {
    const password = document.getElementById("password").value;

    if (!password) {
        alert("Generate a password first!");
        return;
    }

    try {
        await navigator.clipboard.writeText(password);
        alert("Password copied!");
    } catch {
        alert("Copy is unavailable. Select and copy the password manually.");
    }
}
</script>

</body>
</html>
