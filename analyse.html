
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Expense Tracker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #4338ca;
    color: white;
    text-align: center;
    padding: 25px;
}

.container {
    max-width: 850px;
    margin: 30px auto;
    padding: 15px;
}

.budget-box, .form-box, .expense-box {
    background: white;
    padding: 22px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px #0000000c;
}

.summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

.summary div {
    background: white;
    padding: 20px;
    border-radius: 12px;
}

.summary p {
    color: #64748b;
    margin-bottom: 8px;
}

.summary h2 {
    margin: 0;
    color: #4338ca;
    overflow-wrap: anywhere;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
}

button {
    background: #4338ca;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 7px;
    cursor: pointer;
}

button:hover {
    background: #312e81;
}

.expense-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #e2e8f0;
    padding: 14px 0;
}

.expense-item p {
    margin: 5px 0;
    color: #64748b;
}

.delete-btn {
    background: #dc2626;
    padding: 8px 12px;
}

.delete-btn:hover {
    background: #991b1b;
}

footer {
    text-align: center;
    padding: 20px;
    color: #64748b;
}
</style>
</head>

<body>

<header>
    <h1>💰 Student Expense Tracker</h1>
    <p>Manage your money, control your spending!</p>
</header>

<div class="container">

    <section class="budget-box">
        <h2>Set Monthly Budget</h2>
        <input type="number" id="budgetInput"
               placeholder="Enter budget in ₹" min="0" step="0.01">
        <button onclick="setBudget()">Save Budget</button>
    </section>

    <section class="summary">
        <div>
            <p>Monthly Budget</p>
            <h2 id="budget">₹0.00</h2>
        </div>
        <div>
            <p>Total Spent</p>
            <h2 id="spent">₹0.00</h2>
        </div>
        <div>
            <p>Remaining</p>
            <h2 id="remaining">₹0.00</h2>
        </div>
    </section>

    <section class="form-box">
        <h2>Add New Expense</h2>

        <form id="expenseForm">
            <label for="title">Expense Name</label>
            <input id="title" type="text"
                   placeholder="e.g. Lunch" required>

            <label for="amount">Amount (₹)</label>
            <input id="amount" type="number"
                   placeholder="Enter amount" min="0.01"
                   step="0.01" required>

            <label for="category">Category</label>
            <select id="category">
                <option>Food</option>
                <option>Travel</option>
                <option>Education</option>
                <option>Shopping</option>
                <option>Other</option>
            </select>

            <button type="submit">Add Expense</button>
        </form>
    </section>

    <section class="expense-box">
        <h2>Expense History</h2>
        <div id="expenseList"></div>
    </section>

</div>

<footer>
    <p>Student Expense Tracker © 2026</p>
</footer>

<script>
let budget = Number(localStorage.getItem("studentBudget")) || 0;
let expenses = JSON.parse(
    localStorage.getItem("studentExpenses") || "[]"
);

function money(value) {
    return "₹" + value.toFixed(2);
}

function setBudget() {
    const input = document.getElementById("budgetInput");
    const value = Number(input.value);

    if (input.value.trim() === "" ||
        !Number.isFinite(value) || value < 0) {
        alert("Please enter a valid budget.");
        return;
    }

    budget = value;
    localStorage.setItem("studentBudget", budget);
    input.value = "";
    render();
}

document.getElementById("expenseForm")
.addEventListener("submit", function(event) {
    event.preventDefault();

    const title = document.getElementById("title").value.trim();
    const amountInput = document.getElementById("amount");
    const amount = Number(amountInput.value);
    const category = document.getElementById("category").value;

    if (!title || amountInput.value.trim() === "" ||
        !Number.isFinite(amount) || amount <= 0) {
        alert("Enter a valid expense name and amount.");
        return;
    }

    expenses.unshift({
        id: Date.now() + Math.random(),
        title: title,
        amount: amount,
        category: category
    });

    localStorage.setItem(
        "studentExpenses", JSON.stringify(expenses)
    );

    this.reset();
    render();
});

function deleteExpense(id) {
    expenses = expenses.filter(item => item.id !== id);

    localStorage.setItem(
        "studentExpenses", JSON.stringify(expenses)
    );

    render();
}

function render() {
    const total = expenses.reduce(
        (sum, item) => sum + item.amount, 0
    );

    document.getElementById("budget").textContent = money(budget);
    document.getElementById("spent").textContent = money(total);
    document.getElementById("remaining").textContent =
        money(budget - total);

    const list = document.getElementById("expenseList");
    list.replaceChildren();

    if (expenses.length === 0) {
        list.textContent = "No expenses added yet.";
        return;
    }

    expenses.forEach(item => {
        const row = document.createElement("div");
        row.className = "expense-item";

        const details = document.createElement("div");
        const name = document.createElement("strong");
        name.textContent = item.title;

        const category = document.createElement("p");
        category.textContent = item.category;

        details.append(name, category);

        const right = document.createElement("div");
        right.style.textAlign = "right";

        const price = document.createElement("strong");
        price.textContent = money(item.amount);

        const remove = document.createElement("button");
        remove.className = "delete-btn";
        remove.textContent = "Delete";
        remove.style.display = "block";
        remove.style.marginTop = "8px";
        remove.addEventListener("click", () =>
            deleteExpense(item.id)
        );

        right.append(price, remove);
        row.append(details, right);
        list.appendChild(row);
    });
}

render();
</script>

</body>
</html>
