
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Code Lab</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101820;
    color: #e8faff;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
}

.app {
    width: 100%;
    max-width: 550px;
    background: #1b2b34;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 0 25px #00e5ff20;
}

h1 { color: #00e5ff; text-align: center; }
p { color: #b8ccd5; line-height: 1.5; }

textarea, select {
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    border: 1px solid #42616d;
    border-radius: 8px;
    background: #101820;
    color: white;
    font-size: 16px;
}

textarea { height: 110px; resize: vertical; }

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #00bcd4;
    color: #101820;
    font-weight: bold;
    cursor: pointer;
}

button:hover { background: #67e8f9; }

.output {
    margin-top: 20px;
    padding: 15px;
    background: #101820;
    border-radius: 10px;
    overflow-wrap: anywhere;
    min-height: 65px;
}

#status { color: #67e8f9; }

.small { font-size: 13px; }
</style>
</head>
<body>

<div class="app">
    <h1>🔐 Secret Code Lab</h1>
    <p>Transform ordinary text into a secret message!</p>

    <label for="message">Enter your message</label>
    <textarea id="message" placeholder="Type a message..."></textarea>

    <label for="method">Choose a code</label>
    <select id="method">
        <option value="shift">Letter Shift Cipher</option>
        <option value="binary">Binary Text</option>
        <option value="reverse">Reverse Message</option>
    </select>

    <div class="buttons">
        <button id="encode">🔒 Encode</button>
        <button id="decode">🔓 Decode</button>
    </div>

    <div class="output">
        <strong>Result:</strong>
        <p id="result">Your result will appear here.</p>
    </div>

    <div class="buttons">
        <button id="copy">📋 Copy Result</button>
        <button id="clear">Clear All</button>
    </div>

    <p id="status" class="small">Ready to encode or decode.</p>
    <p class="small">Note: These are learning ciphers, not secure encryption.</p>
</div>

<script>
const message = document.getElementById("message");
const method = document.getElementById("method");
const result = document.getElementById("result");
const status = document.getElementById("status");

function shiftText(text, amount) {
    return [...text].map(char => {
        const code = char.charCodeAt(0);

        if (code >= 65 && code <= 90) {
            return String.fromCharCode(
                ((code - 65 + amount + 26) % 26) + 65
            );
        }

        if (code >= 97 && code <= 122) {
            return String.fromCharCode(
                ((code - 97 + amount + 26) % 26) + 97
            );
        }

        return char;
    }).join("");
}

function encode(text) {
    if (method.value === "shift") {
        return shiftText(text, 3);
    }

    if (method.value === "binary") {
        return [...new TextEncoder().encode(text)]
            .map(byte => byte.toString(2).padStart(8, "0"))
            .join(" ");
    }

    return [...text].reverse().join("");
}

function decode(text) {
    if (method.value === "shift") {
        return shiftText(text, -3);
    }

    if (method.value === "binary") {
        if (!text.trim()) return "";

        const parts = text.trim().split(/\s+/);

        if (!parts.every(part => /^[01]{8}$/.test(part))) {
            throw new Error("Enter binary bytes of 8 bits each.");
        }

        const bytes = parts.map(part => parseInt(part, 2));
        return new TextDecoder("utf-8", { fatal: true })
            .decode(new Uint8Array(bytes));
    }

    return [...text].reverse().join("");
}

document.getElementById("encode").addEventListener("click", () => {
    result.textContent = encode(message.value);
    status.textContent = "Message encoded successfully.";
});

document.getElementById("decode").addEventListener("click", () => {
    try {
        result.textContent = decode(message.value);
        status.textContent = "Message decoded successfully.";
    } catch (error) {
        result.textContent = "Unable to decode this message.";
        status.textContent = error.message;
    }
});

document.getElementById("copy").addEventListener("click", async () => {
    try {
        await navigator.clipboard.writeText(result.textContent);
        status.textContent = "Result copied!";
    } catch {
        status.textContent = "Copy unavailable. Select and copy the result manually.";
    }
});

document.getElementById("clear").addEventListener("click", () => {
    message.value = "";
    result.textContent = "Your result will appear here.";
    status.textContent = "Ready for a new message.";
});
</script>

</body>
</html>
