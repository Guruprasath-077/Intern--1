
<!DOCTYPE html>
<html>
<head>
<title>Magic Mood Generator</title>
<style>
body {
    font-family: Arial;
    text-align: center;
    background: #dbeafe;
    margin: 0;
    padding: 40px 15px;
    transition: 0.5s;
}
.container {
    max-width: 450px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 5px 20px #0002;
}
h1 { color: #4f46e5; }
#emoji {
    font-size: 85px;
    margin: 20px;
}
select, button {
    padding: 13px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}
select { background: #e0e7ff; }
button {
    background: #4f46e5;
    color: white;
    cursor: pointer;
}
button:hover { background: #3730a3; }
#message {
    font-size: 20px;
    margin: 20px 0;
    font-weight: bold;
}
#music { color: #64748b; }
</style>
</head>
<body>

<div class="container">
    <h1>✨ Magic Mood</h1>
    <p>How are you feeling today?</p>

    <div id="emoji">🌈</div>

    <select id="mood">
        <option value="happy">Happy 😊</option>
        <option value="sad">Sad 😢</option>
        <option value="angry">Angry 😡</option>
        <option value="relaxed">Relaxed 😌</option>
        <option value="excited">Excited 🤩</option>
    </select>

    <br>
    <button onclick="generateMood()">Generate My Mood</button>
    <button onclick="surprise()">Surprise Me 🎁</button>

    <div id="message">Your magic message is waiting!</div>
    <p id="music">🎵 Music suggestion will appear here.</p>
</div>

<script>
const moods = {
    happy: {
        emoji: "😊",
        color: "#fef3c7",
        messages: [
            "Keep smiling! Your happiness is contagious!",
            "Today is full of beautiful possibilities!",
            "Spread your sunshine everywhere!"
        ],
        music: "Happy pop music"
    },
    sad: {
        emoji: "💙",
        color: "#bfdbfe",
        messages: [
            "It's okay not to be okay. Better days are coming.",
            "You are stronger than you think.",
            "Take a deep breath. Tomorrow is a new beginning."
        ],
        music: "Soft relaxing music"
    },
    angry: {
        emoji: "😡",
        color: "#fecaca",
        messages: [
            "Pause, breathe and take control.",
            "Your peace is more important than anger.",
            "Turn your energy into something positive."
        ],
        music: "Calm instrumental music"
    },
    relaxed: {
        emoji: "😌",
        color: "#bbf7d0",
        messages: [
            "Enjoy this peaceful moment!",
            "Slow down and appreciate life.",
            "Relax. You deserve this moment."
        ],
        music: "Nature sounds"
    },
    excited: {
        emoji: "🤩",
        color: "#f5d0fe",
        messages: [
            "Amazing things are waiting for you!",
            "Let your energy take you higher!",
            "Make today unforgettable!"
        ],
        music: "Energetic dance music"
    }
};

function generateMood() {
    let selected = document.getElementById("mood").value;
    let data = moods[selected];

    let random = Math.floor(Math.random() * data.messages.length);

    document.body.style.background = data.color;
    document.getElementById("emoji").innerText = data.emoji;
    document.getElementById("message").innerText =
        data.messages[random];
    document.getElementById("music").innerText =
        "🎵 Try listening to: " + data.music;
}

function surprise() {
    let options = Object.keys(moods);
    let random = options[Math.floor(Math.random() * options.length)];

    document.getElementById("mood").value = random;
    generateMood();
}
</script>

</body>
</html>
