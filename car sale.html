
<!DOCTYPE html>
<html>
<head>
<title>Online Car Sales</title>
<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f1f5f9;
}
header {
    background: #172554;
    color: white;
    padding: 20px;
    text-align: center;
}
.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}
.filters {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}
input, select {
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    flex: 1;
    min-width: 0;
}
.cars {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}
.card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 3px 10px #ccc;
}
.card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
}
.details {
    padding: 15px;
}
.price {
    color: #16a34a;
    font-size: 20px;
    font-weight: bold;
}
button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 11px;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
}
button:hover {
    background: #1e40af;
}
footer {
    background: #172554;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: 30px;
}
@media(max-width: 500px) {
    .filters { flex-direction: column; }
}
</style>
</head>
<body>

<header>
<h1>🚗 Auto World</h1>
<p>Find Your Dream Car</p>
</header>

<div class="container">
<h2>Available Cars</h2>

<div class="filters">
<input id="search" placeholder="Search car..."
oninput="displayCars()">

<select id="fuel" onchange="displayCars()">
<option value="All">All Fuel Types</option>
<option value="Petrol">Petrol</option>
<option value="Diesel">Diesel</option>
<option value="Electric">Electric</option>
</select>
</div>

<div class="cars" id="carList"></div>
</div>

<footer>
<p>Auto World | Car Sales Website</p>
<p>Contact: autoworld@example.com</p>
</footer>

<script>
let cars = [
{
name: "Hyundai Creta",
price: "₹11 Lakh",
fuel: "Petrol",
year: 2024,
image: "https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?w=600"
},
{
name: "Tata Nexon",
price: "₹9 Lakh",
fuel: "Diesel",
year: 2023,
image: "https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=600"
},
{
name: "Tesla Model 3",
price: "₹35 Lakh",
fuel: "Electric",
year: 2024,
image: "https://images.unsplash.com/photo-1560958089-b8a1929cea89?w=600"
},
{
name: "Toyota Fortuner",
price: "₹35 Lakh",
fuel: "Diesel",
year: 2023,
image: "https://images.unsplash.com/photo-1519641471654-76ce0107ad1b?w=600"
}
];

function displayCars() {
    let search = document.getElementById("search").value.toLowerCase();
    let fuel = document.getElementById("fuel").value;

    let filtered = cars.filter(car =>
        car.name.toLowerCase().includes(search) &&
        (fuel === "All" || car.fuel === fuel)
    );

    let output = "";

    filtered.forEach((car, index) => {
        output += `
        <div class="card">
            <img src="${car.image}" alt="${car.name}"
                 onerror="this.style.display='none'">
            <div class="details">
                <h3>${car.name}</h3>
                <p>Year: ${car.year}</p>
                <p>Fuel: ${car.fuel}</p>
                <p class="price">${car.price}</p>
                <button onclick="buyCar('${car.name}')">
                    Buy Now
                </button>
            </div>
        </div>`;
    });

    document.getElementById("carList").innerHTML =
        output || "<p>No cars found!</p>";
}

function buyCar(name) {
    alert("Thank you for your interest in " + name +
          "! Our sales team will contact you.");
}

displayCars();
</script>

</body>
</html>
